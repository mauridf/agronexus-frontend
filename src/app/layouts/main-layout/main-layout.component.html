<!-- Container principal do layout -->
<mat-sidenav-container class="layout-container">
  
  <!-- SIDEBAR (Menu Lateral) -->
  <mat-sidenav 
    #sidenav
    [mode]="isSidenavFixed ? 'side' : 'over'"
    [opened]="isSidenavOpen"
    class="sidebar"
  >
    <!-- Logo do AgroNexus -->
    <div class="sidebar-header">
      <div class="logo-container">
        <mat-icon class="logo-icon">agriculture</mat-icon>
        <span class="logo-text">AgroNexus</span>
      </div>
      <span class="logo-version">v1.0</span>
    </div>

    <mat-divider></mat-divider>

    <!-- Menu de Navegação -->
    <mat-nav-list class="sidebar-nav">
      
      <!-- Dashboard (visível para todos) -->
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <!-- Produtores (Admin) -->
      @if (isAdmin()) {
        <a mat-list-item routerLink="/producers" routerLinkActive="active-link" (click)="sidenav.close()">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Produtores</span>
        </a>
      }

      <!-- Fazendas (visível para todos) -->
      <a mat-list-item routerLink="/farms" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Fazendas</span>
      </a>

      <!-- Agricultura -->
      <a mat-list-item routerLink="/agriculture" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>grass</mat-icon>
        <span matListItemTitle>Agricultura</span>
      </a>

      <!-- Inventário -->
      <a mat-list-item routerLink="/inventory" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Inventário</span>
      </a>

      <!-- Operações -->
      <a mat-list-item routerLink="/operations" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Operações</span>
      </a>

      <!-- Monitoramento -->
      <a mat-list-item routerLink="/monitoring" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>monitor_heart</mat-icon>
        <span matListItemTitle>Monitoramento</span>
      </a>

      <!-- Financeiro -->
      <a mat-list-item routerLink="/financial" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>attach_money</mat-icon>
        <span matListItemTitle>Financeiro</span>
      </a>

      <!-- Usuários (Admin) -->
      @if (isAdmin()) {
        <mat-divider></mat-divider>
        <a mat-list-item routerLink="/users" routerLinkActive="active-link" (click)="sidenav.close()">
          <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
          <span matListItemTitle>Usuários</span>
        </a>
      }
    </mat-nav-list>

    <!-- Rodapé do Sidebar -->
    <div class="sidebar-footer">
      <span class="footer-text">© 2025 AgroNexus</span>
    </div>
  </mat-sidenav>

  <!-- ÁREA PRINCIPAL -->
  <mat-sidenav-content class="main-content">
    
    <!-- HEADER -->
    <mat-toolbar class="header" color="primary">
      <!-- Botão menu mobile -->
      <button mat-icon-button (click)="toggleSidenav()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Título da página (placeholder) -->
      <span class="header-title">AgroNexus</span>

      <!-- Espaçador -->
      <span class="spacer"></span>

      <!-- Botão Notificações -->
      <button mat-icon-button class="header-icon" matTooltip="Notificações">
        <mat-icon matBadge="3" matBadgeColor="warn">notifications</mat-icon>
      </button>

      <!-- Menu do Usuário -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ getUserName() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="goToProfile()">
          <mat-icon>person</mat-icon>
          <span>Meu Perfil</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Configurações</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- ÁREA DE CONTEÚDO (onde as páginas são carregadas) -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
